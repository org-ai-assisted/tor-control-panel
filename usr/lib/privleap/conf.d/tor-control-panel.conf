[action:tor-control-panel-read-tor-default-log]
Command=journalctl -n 200 -u tor@default.service
AuthorizedGroups=sudo,privleap
AuthorizedUsers=user

[action:tcp-tor-control-restart]
Command=/usr/libexec/tor-control-panel/tcp-tor-control restart
AuthorizedGroups=sudo,privleap
AuthorizedUsers=user

[action:tcp-tor-control-reload]
Command=/usr/libexec/tor-control-panel/tcp-tor-control reload
AuthorizedGroups=sudo,privleap
AuthorizedUsers=user

[action:tcp-tor-control-stop]
Command=/usr/libexec/tor-control-panel/tcp-tor-control stop
AuthorizedGroups=sudo,privleap
AuthorizedUsers=user

[action:tcp-tor-control-status]
Command=/usr/libexec/tor-control-panel/tcp-tor-control status
AuthorizedGroups=sudo,privleap
AuthorizedUsers=user

[action:tor-config-sane]
Command=/usr/libexec/anon-gw-anonymizer-config/tor-config-sane
AuthorizedGroups=sudo,privleap
AuthorizedUsers=user

[action:anon-dns-add]
Command=/usr/bin/anon-dns add
AuthorizedGroups=sudo,privleap
AuthorizedUsers=user

[action:anon-dns-remove]
Command=/usr/bin/anon-dns remove
AuthorizedGroups=sudo,privleap
AuthorizedUsers=user

[action:tcp-write-torrc]
Command=/usr/libexec/tor-control-panel/tcp-write-torrc
AuthorizedGroups=sudo,privleap
AuthorizedUsers=user
