## The unprivileged GUI (running as the desktop user) stages the torrc into
## tor.conf here, then the root helper acw-write-torrc copies it into place. The
## directory must therefore be writable by that user, but it MUST be sticky
## (1777, not 0777): with the sticky bit set, fs.protected_symlinks (default on)
## stops the root helper from following a symlink a local user planted here --
## e.g. tor.conf -> /etc/shadow to have its content copied into the
## world-readable drop-in. Without the sticky bit that protection does not apply.
d /run/anon-connection-wizard 1777 root root -
Z /run/anon-connection-wizard/* 0666 root root -
