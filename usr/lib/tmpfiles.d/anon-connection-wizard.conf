## root:user 0770 (not world-writable): the unprivileged GUI runs as group
## 'user' and must create the staging tor.conf; root's acw-write-torrc reads it.
## No other local account may enter the directory, so the cleartext credential it
## briefly holds cannot be read, tampered with, or symlink-swapped by another user.
d /run/anon-connection-wizard 0770 root user -
