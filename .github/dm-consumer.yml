## AI-Assisted

## Per-repo parameters for developer-meta-files consumer workflows, read at
## workflow runtime. Here: extra apt packages the dist-ai test suites need
## (python3-pyqt5 for the offscreen PyQt5 GUI tests), plus a helper-scripts
## checkout -- anon_connection_wizard imports guimessages, which ships in
## helper-scripts and has no Debian package, so without it every suite that
## touches the wizard dies with ModuleNotFoundError.
dist-ai-tests:
  apt-packages: "python3 python3-pytest python3-hypothesis python3-pyqt5"
  helper-scripts: true
