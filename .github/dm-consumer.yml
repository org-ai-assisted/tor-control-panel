## AI-Assisted

## Per-repo parameters for developer-meta-files consumer workflows, read at
## workflow runtime. Here: extra apt packages the dist-ai test suites need
## (python3-pyqt6 for the offscreen PyQt6 GUI, python3-stem for the Tor
## controller the status watcher drives), plus the helper-scripts checkout for
## the sanitize_string module the GUI imports.
dist-ai-tests:
  helper-scripts: true
  apt-packages: "python3 python3-pytest python3-hypothesis python3-pyqt6 python3-stem"
