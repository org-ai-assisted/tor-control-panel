## AI-Assisted

## Per-repo parameters for developer-meta-files consumer workflows, read at
## workflow runtime. Here: extra apt packages the dist-ai test suites need
## (python3-pyqt5 for the offscreen PyQt5 GUI tests, python3-yaml for the
## bootstrap-tag parsing, python3-stem for the control-port controller tests)
## plus the helper-scripts checkout the suites source at runtime.
dist-ai-tests:
  apt-packages: "python3 python3-pytest python3-hypothesis python3-pyqt5 python3-yaml python3-stem"
  helper-scripts: true
