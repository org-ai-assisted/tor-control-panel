## AI-Assisted

## tor-control-panel-specific: always run the heavy dist-ai FUZZ suite on CI, in
## addition to the fast --core run in the standard "dist-ai tests" workflow.
## Fuzzes the untrusted-input parsers (torrc gen/parse, custom-bridge extraction,
## the shared validators) -- see dist-ai's fuzz_torrc.py.
##
## This is an INTENTIONAL per-repo workflow, NOT a managed consumer template
## (pkg_update_consumer_workflows must not overwrite it). It reuses the same
## reusable-dist-ai-tests.yml, passing the --fuzz category so it inherits the
## caller checkout, the dm-consumer.yml apt-packages/helper-scripts setup, and
## the per-suite timeout/log handling.
##
## Reusable docs:
## https://github.com/org-ai-assisted/developer-meta-files/blob/master/.github/workflows/reusable-dist-ai-tests.yml

name: dist-ai fuzz

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dist-ai-fuzz:
    ## Pinned to an immutable commit rather than @master: this job executes
    ## shared code from another repo, so a push there must not change what
    ## runs here without a reviewed bump. Bump deliberately.
    uses: org-ai-assisted/developer-meta-files/.github/workflows/reusable-dist-ai-tests.yml@69862539432fa06fa09a5d4f9bdc06a9cb917c4e
    with:
      categories: '--fuzz'
